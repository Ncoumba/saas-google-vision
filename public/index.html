
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Cloud Vision Image Analyzer</title>
</head>
<body>
  <h1>Google Cloud Vision Image Analyzer</h1>

  <p>Upload an image to see what Google AI detects!</p>

  <form action="/analyze" method="POST" enctype="multipart/form-data">
    <label for="pic">Choose an image:</label>
    <input type="file" id="pic" name="pic" accept="image/*" required>
    <button type="submit">Upload & Analyze</button>
  </form>
</body>
</html>
